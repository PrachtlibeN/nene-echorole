[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nene-backend"
version = "0.1.0"
description = "Local-first scenario roleplay API"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.17.1",
    "fastapi==0.120.0",
    "httpx==0.28.1",
    "pydantic==2.12.3",
    "pydantic-settings==2.11.0",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.44",
    "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.14.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not llm and not stt'"
markers = [
    "llm: opt-in tests requiring a local LLM",
    "stt: opt-in tests requiring a local speech model",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "httpx.*", "uvicorn.*"]
ignore_missing_imports = true
