services:
  - type: web
    name: echorole-backend
    runtime: python
    buildCommand: pip install -e .
    startCommand: mkdir -p data && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ECHOROLE_DB_URL
        value: sqlite:///./data/echorole.db
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: LLM_PROVIDER
        value: openai_compatible
